<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda — HAVENLY HOME DECOR</title>
  <meta name="description" content="Catálogo de productos de decoración del hogar con filtros por categoría, precio y disponibilidad.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23C06B45'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Georgia'>H</text></svg>">
</head>
<body>

  <div id="site-topbar"></div>
  <header id="site-header"></header>

  <section class="page-head">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / <span data-i18n="nav.shop"></span></div>
      <h1 data-i18n="nav.shop"></h1>
      <p data-i18n="shop.subtitle"></p>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="container">
      <div class="shop-toolbar">
        <button class="btn btn-outline btn-sm filter-toggle" id="filter-toggle">☰ <span data-i18n="filter.title"></span></button>
        <span class="results" id="results-count"></span>
        <select id="sort-select" aria-label="Ordenar">
          <option value="featured" data-i18n="sort.featured"></option>
          <option value="price-asc" data-i18n="sort.priceAsc"></option>
          <option value="price-desc" data-i18n="sort.priceDesc"></option>
          <option value="rating" data-i18n="sort.rating"></option>
        </select>
      </div>

      <div class="shop-layout">
        <aside class="filters" id="filters">
          <h3 data-i18n="filter.title"></h3>

          <div class="filter-group">
            <h4 data-i18n="filter.category"></h4>
            <div id="cat-filters"></div>
          </div>

          <div class="filter-group">
            <h4 data-i18n="filter.price"></h4>
            <div class="price-range">
              <input type="range" id="price-range" min="0" max="600" step="10" value="600">
              <div class="vals"><span>$0</span><span id="price-max-label">$600</span></div>
            </div>
          </div>

          <div class="filter-group">
            <h4 data-i18n="filter.avail"></h4>
            <label><input type="radio" name="avail" value="all" checked> <span data-i18n="filter.all"></span></label>
            <label><input type="radio" name="avail" value="in"> <span data-i18n="filter.in"></span></label>
            <label><input type="radio" name="avail" value="out"> <span data-i18n="filter.out"></span></label>
          </div>

          <button class="btn btn-outline btn-sm" id="clear-filters" data-i18n="filter.clear"></button>
        </aside>

        <div>
          <div class="products-grid" id="shop-grid"></div>
          <div id="no-results" style="display:none;text-align:center;padding:50px 10px;color:var(--muted)" data-i18n="filter.noresults"></div>
        </div>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let state = {
      cats: params.get("cat") ? [params.get("cat")] : [],
      maxPrice: 600,
      avail: "all",
      sort: "featured",
      q: params.get("q") || "",
      filtro: params.get("filtro") || ""
    };

    function filteredProducts() {
      let list = PRODUCTS.slice();
      if (state.cats.length) list = list.filter((p) => state.cats.includes(p.category));
      list = list.filter((p) => p.price <= state.maxPrice);
      if (state.avail === "in") list = list.filter((p) => p.stock > 0);
      if (state.avail === "out") list = list.filter((p) => p.stock <= 0);
      if (state.filtro === "nuevo") list = list.filter((p) => p.newArrival);
      if (state.filtro === "oferta") list = list.filter((p) => p.badge === "oferta");
      if (state.filtro === "favoritos") list = list.filter((p) => isFav(p.id));
      if (state.q) {
        const q = state.q.toLowerCase();
        list = list.filter((p) => (p.name + " " + p.nameEn + " " + catName(p.category)).toLowerCase().includes(q));
      }
      if (state.sort === "price-asc") list.sort((a, b) => a.price - b.price);
      if (state.sort === "price-desc") list.sort((a, b) => b.price - a.price);
      if (state.sort === "rating") list.sort((a, b) => b.rating - a.rating);
      return list;
    }

    function renderFilters() {
      const el = document.getElementById("cat-filters");
      el.innerHTML = CATEGORIES.map((c) => {
        const count = PRODUCTS.filter((p) => p.category === c.key).length;
        return `<label><input type="checkbox" value="${c.key}" ${state.cats.includes(c.key) ? "checked" : ""}> <span>${catName(c.key)}</span><span class="count">${count}</span></label>`;
      }).join("");
      el.querySelectorAll("input").forEach((cb) => cb.addEventListener("change", () => {
        state.cats = [...el.querySelectorAll("input:checked")].map((i) => i.value);
        render();
      }));
    }

    function render() {
      const list = filteredProducts();
      const grid = document.getElementById("shop-grid");
      grid.innerHTML = list.map((p) => productCardHTML(p)).join("");
      document.getElementById("no-results").style.display = list.length ? "none" : "block";
      document.getElementById("results-count").textContent = `${list.length} ${t("filter.results")}`;
      document.getElementById("price-max-label").textContent = "$" + state.maxPrice;
      bindProductCards();
    }

    window.__renderPage = function () {
      renderFilters();
      render();
    };

    document.getElementById("price-range").addEventListener("input", (e) => {
      state.maxPrice = +e.target.value;
      render();
    });
    document.querySelectorAll('input[name="avail"]').forEach((r) => r.addEventListener("change", () => {
      state.avail = r.value;
      render();
    }));
    document.getElementById("sort-select").addEventListener("change", (e) => {
      state.sort = e.target.value;
      render();
    });
    document.getElementById("clear-filters").addEventListener("click", () => {
      state.cats = []; state.maxPrice = 600; state.avail = "all"; state.q = ""; state.filtro = "";
      document.getElementById("price-range").value = 600;
      document.querySelector('input[name="avail"][value="all"]').checked = true;
      renderFilters();
      render();
    });
    document.getElementById("filter-toggle").addEventListener("click", () => {
      document.getElementById("filters").classList.toggle("open");
    });

    window.__renderPage();
  </script>
</body>
</html>
